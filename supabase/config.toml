# Supabase CLI configuration for local development.
#
#   supabase start        # boot Postgres + Auth + Realtime + Studio
#   supabase db reset     # apply migrations/*.sql then seed.sql
#
# The app itself needs NONE of this: with no Supabase env vars set it runs in
# demo mode against the in-memory dataset in lib/seed (BUILD_SPEC §1).

project_id = "agentdistrict"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
# `extensions` is on the search path so pg_trgm / pgcrypto resolve from PostgREST.
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

# `supabase db reset` runs the migrations, then this file.
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# Local mail catcher — where magic links land during development.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = false

[realtime]
enabled = true

[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local only: skip the confirmation step so signup works against Inbucket.
enable_confirmations = false
